<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShutdownTimerPro — Obsidian Studio</title>
  <link rel="icon" type="image/png" href="app_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(16, 19, 28, 0.78);
      --card-inner-bg: rgba(10, 12, 18, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.16);
      
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --muted: #64748b;

      /* Active Action Accent */
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.22);
      --accent-dim: rgba(239, 68, 68, 0.12);
      --accent-border: rgba(239, 68, 68, 0.35);

      /* Studio jewel colors */
      --col-shutdown: #ef4444;
      --col-sleep: #a855f7;
      --col-restart: #06b6d4;
      --col-lock: #f59e0b;
      --col-monitor: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Plus Jakarta Sans', 'Segoe UI Variable', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(20, 24, 36, 0.4) 0%, rgba(9, 10, 15, 0.9) 100%);
      background-size: 20px 20px, 100% 100%;
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      position: relative;
    }

    /* Ambient Subtle Diffuser */
    .ambient-glow {
      position: absolute;
      width: 380px;
      height: 240px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header Bar */
    header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: rgba(12, 14, 21, 0.92);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
      -webkit-app-region: drag;
      cursor: move;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transition: all 0.3s ease;
      position: relative;
    }

    .status-pip::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      opacity: 0.4;
      animation: pipPulse 2.6s infinite cubic-bezier(0.2, 0.8, 0.4, 1);
    }

    @keyframes pipPulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #fff;
    }

    .brand-ver {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }

    .win-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .btn-sys {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-sys svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
    }

    .btn-sys:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--card-border);
      color: var(--text);
    }

    .btn-sys.close:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }

    /* Main Scroll Area */
    main {
      flex: 1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      z-index: 1;
      overflow-y: auto;
    }

    main::-webkit-scrollbar {
      width: 4px;
    }
    main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Studio Card */
    .studio-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s ease;
    }

    .studio-card:hover {
      border-color: var(--card-border-hover);
    }

    /* Chrono Module */
    .chrono-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 10px 10px;
      position: relative;
    }

    .chrono-meta-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .meta-mode-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .meta-mode-tag svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
    }

    .status-capsule {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 12px;
      padding: 2px 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--accent);
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .status-capsule-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .chrono-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #fff;
      margin: 2px 0 6px 0;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px var(--accent-glow);
    }

    /* Precision Horizontal Gauge */
    .chrono-meter {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .meter-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transition: width 0.3s linear, background 0.3s ease;
    }

    .meter-ticks {
      display: flex;
      justify-content: space-between;
      padding: 0 1px;
    }

    .meter-tick {
      width: 1px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Live Telemetry */
    .telemetry-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .telemetry-pod {
      background: var(--card-inner-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 6px 9px;
    }

    .pod-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .pod-label {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pod-label svg {
      width: 10px;
      height: 10px;
      stroke: currentColor;
      fill: none;
    }

    .pod-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
    }

    .pod-bar-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
    }

    .pod-bar-fill {
      height: 100%;
      width: 0%;
      background: #06b6d4;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    /* Segmented Mode Switcher */
    .segmented-control {
      display: flex;
      background: var(--card-inner-bg);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      gap: 3px;
    }

    .segment-tab {
      flex: 1;
      padding: 5px 0;
      text-align: center;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .segment-tab svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
    }

    .segment-tab.active {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* Time Inputs & Tactile Steppers */
    .stepper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stepper-unit {
      background: var(--card-inner-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 9px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stepper-title {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.9px;
      color: var(--muted);
      text-align: center;
    }

    .stepper-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .stepper-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .stepper-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .stepper-btn:active {
      transform: scale(0.94);
    }

    .stepper-input {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
    }

    .stepper-input::-webkit-inner-spin-button,
    .stepper-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Preset Chips */
    .chips-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }

    .chip-key {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 5px 0;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .chip-key:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: translateY(-1px);
    }

    .chip-key:active {
      transform: translateY(0);
    }

    /* Smart Guard & Keep-Awake */
    .guard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .guard-title {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.9px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .guard-title svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
    }

    .caffeine-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
    }

    .caffeine-pill svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
    }

    .caffeine-pill.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: #10b981;
      color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    .studio-select {
      background: var(--card-inner-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 10.5px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 7px;
      outline: none;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.2s ease;
    }

    .studio-select:focus {
      border-color: var(--accent-border);
    }

    .param-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    /* 5 Action Modes Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .action-card {
      padding: 7px 0;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-inner-bg);
      color: var(--text-dim);
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      position: relative;
    }

    .action-card svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .action-card.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 12px var(--accent-glow);
    }

    .action-pip {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: transparent;
    }

    .action-card.active .action-pip {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    /* Snooze Bar */
    .snooze-row {
      display: flex;
      gap: 5px;
    }

    .btn-snooze {
      flex: 1;
      padding: 5px 0;
      border: 1px solid var(--card-border);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-snooze:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-snooze:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Primary Launch Button & Shortcuts */
    .launch-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 1px;
    }

    .btn-launch {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 14px var(--accent-glow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-launch:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .btn-launch:active {
      transform: translateY(1px);
    }

    .btn-launch.running {
      background: #ef4444;
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      animation: alertPulse 2s infinite;
    }

    @keyframes alertPulse {
      0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 24px rgba(239, 68, 68, 0.5); }
      100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
    }

    .btn-sub-action {
      width: 100%;
      padding: 6px 0;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-sub-action svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
    }

    .btn-sub-action:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Keyboard Kbd Badge */
    .kbd-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      letter-spacing: 0.2px;
    }

    /* Warning Overlay */
    .warning-modal {
      position: absolute;
      inset: 0;
      background: rgba(9, 10, 15, 0.95);
      backdrop-filter: blur(24px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .warning-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .warn-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .warn-title svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
    }

    .warn-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 54px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
    }

    /* Toast */
    .studio-toast {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(18, 22, 32, 0.96);
      border: 1px solid var(--card-border-hover);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      z-index: 120;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      text-align: center;
      max-width: 90%;
      white-space: nowrap;
    }

    .studio-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientGlow"></div>
  <div class="studio-toast" id="toast"></div>

  <!-- Warning Modal -->
  <div class="warning-modal" id="warnOverlay">
    <div class="warn-title">
      <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      ВНИМАНИЕ! ЗАВЕРШЕНИЕ РАБОТЫ
    </div>
    <div class="warn-counter" id="warnSecs">60</div>
    <div style="display:flex; gap:8px;">

    <div class="studio-card">

        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>

  </main>

  <script>
    // Audio Synthesizer for tactile feedback
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isMuted = false;
    let isKeepAwake = false;
    let timeType = 'countdown';
    let mode = 'shutdown';
    let isRunning = false;

    const modeColors = {
      shutdown: { main: '#ef4444', glow: 'rgba(239, 68, 68, 0.22)', dim: 'rgba(239, 68, 68, 0.12)', border: 'rgba(239, 68, 68, 0.35)', name: 'ВЫКЛЮЧЕНИЕ' },
      sleep:    { main: '#a855f7', glow: 'rgba(168, 85, 247, 0.22)', dim: 'rgba(168, 85, 247, 0.12)', border: 'rgba(168, 85, 247, 0.35)', name: 'РЕЖИМ СНА' },
      restart:  { main: '#06b6d4', glow: 'rgba(6, 182, 212, 0.22)', dim: 'rgba(6, 182, 212, 0.12)', border: 'rgba(6, 182, 212, 0.35)', name: 'ПЕРЕЗАГРУЗКА' },
      lock:     { main: '#f59e0b', glow: 'rgba(245, 158, 11, 0.22)', dim: 'rgba(245, 158, 11, 0.12)', border: 'rgba(245, 158, 11, 0.35)', name: 'БЛОКИРОВКА' },
      monitor:  { main: '#10b981', glow: 'rgba(16, 185, 129, 0.22)', dim: 'rgba(16, 185, 129, 0.12)', border: 'rgba(16, 185, 129, 0.35)', name: 'ВЫКЛ ДИСПЛЕЯ' }
    };

    function playClick() {
      if (isMuted) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.035);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.005, audioCtx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.035);
      } catch(e) {}
    }

    function playBeep(freq = 600) {
      if (isMuted) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    function toggleMute() {
      isMuted = !isMuted;
      renderMuteState();
      saveCurrentPrefs();
    }

    function renderMuteState() {
      const svg = document.getElementById('soundSvg');
      if (isMuted) {
        svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
      } else {
        svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3200);
    }

    function toggleKeepAwake() {
      isKeepAwake = !isKeepAwake;
      const btn = document.getElementById('caffeineBtn');
      if (isKeepAwake) {
        btn.classList.add('active');
        showToast('Keep-Awake активен: ПК не уйдет в сон');
      } else {
        btn.classList.remove('active');
      }
      saveCurrentPrefs();
    }

    function setTimeType(type) {
      if (isRunning) return;
      timeType = type;
      document.getElementById('tabCountdown').classList.toggle('active', type === 'countdown');
      document.getElementById('tabAtTime').classList.toggle('active', type === 'at_time');
      document.getElementById('countdownSteppers').style.display = (type === 'countdown') ? 'grid' : 'none';
      document.getElementById('quickChips').style.display = (type === 'countdown') ? 'grid' : 'none';
      document.getElementById('atTimeBox').style.display = (type === 'at_time') ? 'flex' : 'none';
      updatePreview();
      saveCurrentPrefs();
    }

    function selectMode(m) {
      mode = m;
      document.querySelectorAll('.action-card').forEach(b => b.classList.remove('active'));
      const activeCard = document.getElementById('m_' + m);
      if (activeCard) activeCard.classList.add('active');

      const col = modeColors[m] || modeColors.shutdown;
      document.documentElement.style.setProperty('--accent', col.main);
      document.documentElement.style.setProperty('--accent-glow', col.glow);
      document.documentElement.style.setProperty('--accent-dim', col.dim);
      document.documentElement.style.setProperty('--accent-border', col.border);
      document.getElementById('metaModeName').innerText = col.name;

      updatePreview();
      saveCurrentPrefs();
    }

    function stepH(delta) {
      if (isRunning) return;
      playClick();
      const inpH = document.getElementById('inpH');
      let val = (parseInt(inpH.value) || 0) + delta;
      if (val < 0) val = 23;
      if (val > 23) val = 0;
      inpH.value = val;
      updatePreview();
      saveCurrentPrefs();
    }

    function stepM(delta) {
      if (isRunning) return;
      playClick();
      const inpM = document.getElementById('inpM');
      let val = (parseInt(inpM.value) || 0) + delta;
      if (val < 0) val = 55;
      if (val > 59) val = 0;
      inpM.value = val;
      updatePreview();
      saveCurrentPrefs();
    }

    function setQuick(h, m) {
      if (isRunning) return;
      document.getElementById('inpH').value = h;
      document.getElementById('inpM').value = m;
      updatePreview();
      saveCurrentPrefs();
    }

    function calculateCountdownSecs() {
      const h = parseInt(document.getElementById('inpH').value || 0);
      const m = parseInt(document.getElementById('inpM').value || 0);
      return h * 3600 + m * 60;
    }

    function updatePreview() {
      if (isRunning) return;
      const conf = modeColors[mode] || modeColors.shutdown;

      if (timeType === 'countdown') {
        const secs = calculateCountdownSecs();
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        document.getElementById('timeDigits').innerText =
          String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':00';
        document.getElementById('badgeText').innerText = 'READY';
      } else {
        const atVal = document.getElementById('inpAtTime').value || '00:00';
        document.getElementById('timeDigits').innerText = atVal + ':00';
        document.getElementById('badgeText').innerText = 'AT ' + atVal;
      }
      document.getElementById('meterFill').style.width = '0%';
    }

    document.getElementById('inpH').addEventListener('input', () => { updatePreview(); saveCurrentPrefs(); });
    document.getElementById('inpM').addEventListener('input', () => { updatePreview(); saveCurrentPrefs(); });
    document.getElementById('inpAtTime').addEventListener('input', () => { updatePreview(); saveCurrentPrefs(); });

    function onGuardSelectChange() {
      const val = document.getElementById('guardSelect').value;
      document.getElementById('procGuardRow').style.display = (val === 'process_guard') ? 'flex' : 'none';
      document.getElementById('netGuardRow').style.display = (val === 'network_guard') ? 'flex' : 'none';
      if (val === 'process_guard') loadProcesses();
      saveCurrentPrefs();
    }

    async function loadProcesses() {
      if (window.pywebview && window.pywebview.api) {
        try {
          const procs = await window.pywebview.api.get_running_processes();
          const sel = document.getElementById('procSelect');
          sel.innerHTML = '';
          if (!procs || procs.length === 0) {
            sel.innerHTML = '<option value="">(Процессы не найдены)</option>';
          } else {
            procs.forEach(p => {
              const opt = document.createElement('option');
              opt.value = p;
              opt.innerText = p;
              sel.appendChild(opt);
            });
          }
        } catch(e) {}
      }
    }

    function saveCurrentPrefs() {
      if (!window.pywebview || !window.pywebview.api) return;
      try {
        const h = parseInt(document.getElementById('inpH').value || 0);
        const m = parseInt(document.getElementById('inpM').value || 0);
        const atVal = document.getElementById('inpAtTime').value || "23:30";
        const guardVal = document.getElementById('guardSelect').value;
        const guardParam = (guardVal === 'process_guard') 
          ? document.getElementById('procSelect').value 
          : document.getElementById('netThreshold').value;

        window.pywebview.api.save_user_prefs({
          hours: h,
          minutes: m,
          at_time: atVal,
          time_type: timeType,
          mode: mode,
          guard: guardVal,
          guard_param: guardParam,
          sound_muted: isMuted,
          keep_awake: isKeepAwake
        });
      } catch(e) {}
    }

    function toggleTimer() {
      if (isRunning) cancelTimer();
      else startTimer();
    }

    async function startTimer() {
      const guard = document.getElementById('guardSelect').value;

      if (!window.pywebview || !window.pywebview.api) {
        showToast("Подключение к ядру системы...");
        return;
      }

      const h = parseInt(document.getElementById('inpH').value || 0);
      const m = parseInt(document.getElementById('inpM').value || 0);

      let res;
      if (guard === 'normal') {
        let secs = 0;
        let atTimeStr = "";
        if (timeType === 'countdown') {
          secs = calculateCountdownSecs();
          if (secs <= 0) {
            showToast("Укажите время работы таймера!");
            return;
          }
        } else {
          atTimeStr = document.getElementById('inpAtTime').value;
          if (!atTimeStr) {
            showToast("Укажите время срабатывания!");
            return;
          }
        }
        res = await window.pywebview.api.start_timer(mode, secs, timeType, atTimeStr, isKeepAwake, h, m);
      } else {
        let guardParam = null;
        if (guard === 'process_guard') {
          guardParam = document.getElementById('procSelect').value;
          if (!guardParam) {
            showToast("Выберите процесс для мониторинга!");
            return;
          }
        } else if (guard === 'network_guard') {
          guardParam = document.getElementById('netThreshold').value || 100;
        }
        res = await window.pywebview.api.start_guard(mode, guard, guardParam, isKeepAwake);
      }

      if (res && res.success) {
        setUIRunning(true);
        showToast("Таймер успешно активирован");
      } else {
        showToast((res && res.error) ? res.error : "Ошибка запуска таймера");
      }
    }

    async function executeNowWithConfirm() {
      if (!window.pywebview || !window.pywebview.api) return;
      const conf = modeColors[mode] || modeColors.shutdown;
      if (confirm(`Вы действительно хотите немедленно выполнить действие: ${conf.name}?`)) {
        showToast(`Выполнение: ${conf.name}...`);
        await window.pywebview.api.execute_action_now(mode);
      }
    }

    async function cancelTimer() {
      if (window.pywebview && window.pywebview.api) {
        try {
          await window.pywebview.api.cancel_timer();
        } catch(e) {}
      }
      setUIRunning(false);
      updatePreview();
      showToast("Таймер отменен");
    }

    async function snooze(mins) {
      if (!isRunning) return;
      if (window.pywebview && window.pywebview.api) {
        try {
          const res = await window.pywebview.api.snooze(mins);
          if (res && res.success) {
            showToast(`+${mins} мин добавлено!`);
            document.getElementById('warnOverlay').classList.remove('active');
          }
        } catch(e) {}
      }
    }

    function setUIRunning(running) {
      isRunning = running;
      const btn = document.getElementById('actionBtn');
      const btnText = document.getElementById('actionBtnText');
      const btnKbd = document.getElementById('actionBtnKbd');

      if (running) {
        btnText.innerText = 'ОТМЕНИТЬ ТАЙМЕР';
        btnKbd.innerText = 'Esc';
        btn.classList.add('running');
        document.querySelectorAll('.btn-snooze').forEach(b => b.disabled = false);
      } else {
        btnText.innerText = 'ЗАПУСТИТЬ ТАЙМЕР';
        btnKbd.innerText = '↵ Enter';
        btn.classList.remove('running');
        document.querySelectorAll('.btn-snooze').forEach(b => b.disabled = true);
        document.getElementById('warnOverlay').classList.remove('active');
      }
    }

    // State Polling Loop (Python Single Source of Truth)
    setInterval(async () => {
      if (window.pywebview && window.pywebview.api) {
        try {
          const state = await window.pywebview.api.get_timer_state();
          if (state.is_active) {
            if (!isRunning) setUIRunning(true);

            const rem = state.rem_secs;
            const tot = Math.max(1, state.total_secs);

            // Warning Overlay
            if (state.warning_active) {
              document.getElementById('warnOverlay').classList.add('active');
              document.getElementById('warnSecs').innerText = rem;
              if (rem <= 10 && rem > 0) playBeep(400 + (11 - rem) * 45);
            } else {
              document.getElementById('warnOverlay').classList.remove('active');
            }

            const h = Math.floor(rem / 3600);
            const m = Math.floor((rem % 3600) / 60);
            const s = rem % 60;
            document.getElementById('timeDigits').innerText =
              String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            document.getElementById('badgeText').innerText = rem + 's REM';

            const pct = Math.min(100, Math.max(0, ((tot - rem) / tot) * 100));
            document.getElementById('meterFill').style.width = pct + '%';
          } else if (state.guard_active) {
            if (!isRunning) setUIRunning(true);
            document.getElementById('timeDigits').innerText = "GUARD";
            document.getElementById('badgeText').innerText = "MONITORING";
            document.getElementById('meterFill').style.width = '100%';
          } else {
            if (isRunning) {
              setUIRunning(false);
              updatePreview();
            }
          }
        } catch(e) {}
      }
    }, 500);

    // Live Telemetry Polling (CPU / RAM)
    setInterval(async () => {
      if (window.pywebview && window.pywebview.api) {
        try {
          const stats = await window.pywebview.api.get_system_stats();
          const cpu = Math.max(0, stats.cpu);
          const ram = Math.max(0, stats.ram);

          document.getElementById('cpuText').innerText = cpu + '%';
          document.getElementById('cpuBar').style.width = cpu + '%';

          document.getElementById('ramText').innerText = ram + '%';
          document.getElementById('ramBar').style.width = ram + '%';
        } catch(e) {}
      }
    }, 1000);

    // Global Keyboard Shortcuts (ENTER ANYWHERE STARTS TIMER / ACTION)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        playClick();
        toggleTimer();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        playClick();
        cancelTimer();
      } else if (e.code === 'Space') {
        const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (tag !== 'input' && tag !== 'select') {
          e.preventDefault();
          playClick();
          toggleTimer();
        }
      }
    });

    // Window Dragging
    let isDragging = false, startX = 0, startY = 0;
    document.getElementById('headerBar').addEventListener('mousedown', (e) => {
      if (e.target.closest('.btn-sys')) return;
      isDragging = true; startX = e.screenX; startY = e.screenY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      startX = e.screenX; startY = e.screenY;
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.move_window(dx, dy);
      }
    });
    window.addEventListener('mouseup', () => isDragging = false);

    // Initial Load & Preferences Restoration
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.pywebview && window.pywebview.api) {
        try {
          const prefs = await window.pywebview.api.get_user_prefs();
          if (prefs) {
            if (prefs.hours !== undefined) document.getElementById('inpH').value = prefs.hours;
            if (prefs.minutes !== undefined) document.getElementById('inpM').value = prefs.minutes;
            if (prefs.at_time) document.getElementById('inpAtTime').value = prefs.at_time;
            if (prefs.time_type) setTimeType(prefs.time_type);
            if (prefs.mode) selectMode(prefs.mode);
            if (prefs.guard) {
              document.getElementById('guardSelect').value = prefs.guard;
              onGuardSelectChange();
            }
            if (prefs.sound_muted !== undefined) {
              isMuted = !!prefs.sound_muted;
              renderMuteState();
            }
            if (prefs.keep_awake) {
              isKeepAwake = true;
              document.getElementById('caffeineBtn').classList.add('active');
            }
          }
        } catch(e) {}
      }
      updatePreview();
    });
  </script>
</body>
</html>
